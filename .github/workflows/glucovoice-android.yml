# Builds the GlucoVoice Android app. Scoped to the glucovoice/ folder so it never touches the
# rest of this repository. Produces a debug APK as a downloadable artifact.
name: GlucoVoice Android

on:
  push:
    paths:
      - "glucovoice/**"
      - ".github/workflows/glucovoice-android.yml"
  pull_request:
    paths:
      - "glucovoice/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glucovoice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test core and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: glucovoice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew --no-daemon --stacktrace :core:test

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: glucovoice/core/build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glucovoice-debug-apk
          path: glucovoice/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
